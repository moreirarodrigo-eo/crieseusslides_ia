<script>
    async function gerarSlidesAutomatico() {
        const tema = document.getElementById('tema').value.trim();
        const curso = document.getElementById('curso').value.trim();
        const publico = document.getElementById('publico').value.trim();
        const duracao = document.getElementById('duracao').value.trim();
        const estilo = document.getElementById('estilo').value;

        const btn = document.getElementById('generateBtn');
        const statusDiv = document.getElementById('status');

        if (!tema || !curso || !publico || !duracao) {
            mostrarStatus('Por favor, preencha todos os campos do formulário.', 'error');
            return;
        }

        btn.disabled = true;
        mostrarStatus('Conectando à IA via Netlify Functions e estruturando os seus slides...', 'loading');

        try {
            // Adiciona log para debug
            console.log('Enviando requisição...', { tema, curso, publico, duracao, estilo });
            
            const response = await fetch('/.netlify/functions/gerar-codigo-slides', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tema, curso, publico, duracao, estilo })
            });

            console.log('Resposta recebida:', response.status);
            
            // Verifica se a resposta é válida antes de parsear
            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                throw new Error(errorData.erro || `Erro HTTP ${response.status}`);
            }

            const data = await response.json();
            console.log('Dados recebidos:', data);

            if (!data.codigo) {
                throw new Error('Resposta da IA não contém código válido');
            }

            // 1. Inicializa o objeto global esperado pelo código gerado
            window.pptx = new PptxGenJS();

            // 2. Transforma o retorno estrito da IA em script executável no cliente
            const rodarScriptAI = new Function(data.codigo);
            rodarScriptAI();

            mostrarStatus('Processamento finalizado com sucesso! O download da sua apresentação iniciará em instantes.', 'success');
        } catch (error) {
            console.error('Erro detalhado:', error);
            mostrarStatus('Erro no processamento: ' + error.message, 'error');
        } finally {
            btn.disabled = false;
        }
    }

    function mostrarStatus(mensagem, tipo) {
        const statusDiv = document.getElementById('status');
        statusDiv.innerText = mensagem;  // ✅ Corrigido
        statusDiv.className = 'status-message ' + tipo;
        statusDiv.style.display = 'block';
    }
</script>
